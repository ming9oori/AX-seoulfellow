services:
  neo4j:
    image: neo4j:5-community
    container_name: ax-kg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-axkg2026}"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "4G"
      NEO4J_server_memory_pagecache_size: "2G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./outputs/11_neo4j_import:/var/lib/neo4j/import:ro

volumes:
  neo4j_data:
  neo4j_logs:
